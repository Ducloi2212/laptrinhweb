<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Login Page</title>
        <script src="https://cdn.tailwindcss.com"></script>
        <link rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
    </head>
    <body class="flex flex-col items-center justify-center min-h-screen bg-gray-100">
        <header class="w-full bg-white py-4 border-b">
            <nav class="flex justify-center space-x-4">
                <a href="#" class="text-black">Home</a>
                <a href="#" class="text-black">Đăng nhập</a>
                <a href="#" class="text-black font-bold">Đăng ký</a>
            </nav>
        </header>

        <main class="flex flex-col items-center justify-center flex-grow">
            <div class="bg-white p-8 rounded shadow-md w-96">
                <h2 class="text-center text-xl font-bold mb-6">Màn hình đăng
                    ký</h2>
                <form>
                    <div class="mb-4">
                        <label for="username"
                            class="block text-gray-700">Username</label>
                        <input type="text" id="username"
                            class="w-full px-3 py-2 border rounded" />
                    </div>
                    <div class="mb-4">
                        <label for="password" class="block text-gray-700">Mật
                            khẩu</label>
                        <input type="password" id="password"
                            class="w-full px-3 py-2 border rounded" />
                    </div>
                    <div class="mb-4">
                        <label for="password" class="block text-gray-700">Nhập lại mmật
                            khẩu</label>
                        <input type="password" id="password"
                            class="w-full px-3 py-2 border rounded" />
                    </div>
                    <div class="mb-4">
                        <label for="password" class="block text-gray-700">Email</label>
                        <input type="password" id="password"
                            class="w-full px-3 py-2 border rounded" />
                    </div>
                    <div class="mb-4 text-right">
                        <a href="#" class="text-blue-500">Đã có tài khoản</a>
                    </div>
                    <div class="text-center">
                        <button type="submit"
                            class="bg-blue-500 text-white px-4 py-2 rounded">Đăng
                            ký</button>
                    </div>
                </form>
            </div>
        </main>

        <footer class="w-full bg-white py-4 border-t">
            <div class="text-center text-gray-700">Lập trình web @01/2024</div>
        </footer>
    </body>
</html>
